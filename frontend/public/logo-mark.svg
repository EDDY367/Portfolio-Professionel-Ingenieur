<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Gradient for 'D' -->
    <linearGradient id="markSilverD" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#E8ECF2"/>
      <stop offset="55%" stop-color="#9EABB9"/>
      <stop offset="85%" stop-color="#C5CFDB"/>
      <stop offset="100%" stop-color="#7A8797"/>
    </linearGradient>

    <!-- Electric Blue Gradient for 'E' -->
    <linearGradient id="markElectricBlue" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="35%" stop-color="#0072E5"/>
      <stop offset="75%" stop-color="#004FB8"/>
      <stop offset="100%" stop-color="#00358A"/>
    </linearGradient>

    <!-- Warm Gold Gradient for 'Y' -->
    <linearGradient id="markGoldY" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="65%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#C77700"/>
    </linearGradient>

    <!-- Dynamic Gold Swoosh Gradient -->
    <linearGradient id="markGoldSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="markGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="25%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="75%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#D48800"/>
    </linearGradient>

    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Glowing Gold Ring -->
  <g filter="url(#markShadow)">
    <circle cx="200" cy="200" r="165" fill="none" stroke="url(#markGoldRing)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 345 215 A 165 165 0 0 1 320 285" fill="none" stroke="#FFE082" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- DEY Letters -->
  <g filter="url(#markShadow)" transform="translate(-50, -25)">
    <!-- Letter E (Blue) -->
    <g fill="url(#markElectricBlue)">
      <path d="M 205 155 H 315 L 315 190 H 245 V 212 H 300 V 244 H 245 V 268 H 320 L 305 303 H 205 Z"/>
    </g>

    <!-- Letter Y (Gold) -->
    <g fill="url(#markGoldY)">
      <path d="M 295 155 L 335 155 L 375 228 L 415 155 L 455 155 L 395 250 V 303 H 355 V 250 Z"/>
    </g>

    <!-- Letter D (Silver) -->
    <g fill="url(#markSilverD)">
      <path d="M 90 155 L 115 155 L 135 155 C 185 155, 230 180, 230 229 C 230 278, 185 303, 135 303 L 105 303 L 90 303 Z M 125 185 V 273 H 135 C 168 273, 195 255, 195 229 C 195 203, 168 185, 135 185 Z" fill-rule="evenodd"/>
    </g>

    <!-- Dynamic Gold Swoosh -->
    <path d="M 100 303 C 140 285, 205 240, 315 195 C 335 187, 355 182, 380 180 C 345 188, 290 215, 220 255 C 170 283, 130 298, 100 303 Z" fill="url(#markGoldSwoosh)"/>
  </g>
</svg>
